name: Arquivar versões anteriores nas Releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/archive-previous-releases.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-historical-releases:
    name: Publicar builds históricos Android e iOS
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Baixar APK anterior à V7
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-android-apk
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39371995901
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/pre-v7/android

      - name: Baixar IPA anterior à V7
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-unsigned
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39371995852
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/pre-v7/ios

      - name: Baixar APK da V7 antes da correção da splash
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-v7-estavel-apk
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39696832524
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/v7-pre-splash/android

      - name: Baixar IPA da V7 antes da correção da splash
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-unsigned
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39696832624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/v7-pre-splash/ios

      - name: Baixar APK da V7.1 certificada
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-v7-1-splash-apk
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39698764904
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/v7-1/android

      - name: Baixar IPA da V7.1 certificada
        uses: actions/download-artifact@v4
        with:
          name: controle-catedral-unsigned
          repository: CaccaITZ/controle-catedral-ios
          run-id: 39698764910
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/v7-1/ios

      - name: Preparar arquivos com nomes por versão e plataforma
        shell: bash
        run: |
          set -euo pipefail

          copy_first() {
            local pattern="$1"
            local destination="$2"
            local source
            source="$(find "${pattern%/*}" -type f -iname "${pattern##*/}" -print -quit)"
            if [ -z "$source" ]; then
              echo "Arquivo não encontrado: $pattern" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$destination")"
            cp "$source" "$destination"
            test -s "$destination"
            echo "Preparado: $destination"
          }

          copy_first 'downloads/pre-v7/android/*.apk' 'release-assets/pre-v7/Controle-Catedral-V6-ultima-estavel-Android.apk'
          copy_first 'downloads/pre-v7/ios/*.ipa' 'release-assets/pre-v7/Controle-Catedral-V6-ultima-estavel-iOS.ipa'
          copy_first 'downloads/v7-pre-splash/android/*.apk' 'release-assets/v7-pre-splash/Controle-Catedral-V7-antes-da-correcao-splash-Android.apk'
          copy_first 'downloads/v7-pre-splash/ios/*.ipa' 'release-assets/v7-pre-splash/Controle-Catedral-V7-antes-da-correcao-splash-iOS.ipa'
          copy_first 'downloads/v7-1/android/*.apk' 'release-assets/v7-1/Controle-Catedral-V7.1-Android.apk'
          copy_first 'downloads/v7-1/ios/*.ipa' 'release-assets/v7-1/Controle-Catedral-V7.1-iOS.ipa'

      - name: Publicar V6 — última versão estável antes da V7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6
          target_commitish: 004c61a1e1be556b59b735747d38aa9652120e53
          name: Controle Catedral V6 — Última estável
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/pre-v7/Controle-Catedral-V6-ultima-estavel-Android.apk
            release-assets/pre-v7/Controle-Catedral-V6-ultima-estavel-iOS.ipa
          body: |
            Versão 6 (V6), a última versão estável antes da V7. Preservada como arquivo histórico de recuperação.

            **Arquivos incluídos:** Android APK e iOS IPA não assinado.
            **Identificação:** Controle Catedral V6 — última versão estável anterior à V7.1 certificada.
            **Observação:** a V6 não foi apagada nem substituída; esta release preserva seus instaladores.

      - name: Remover a release antiga com o rótulo ambíguo Pré-V7
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const oldRelease = releases.find(r => r.tag_name === 'pre-v7');
            if (oldRelease) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: oldRelease.id });
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: 'tags/pre-v7' });
            } catch (error) {
              // A remoção da release pode já ter removido a tag. GitHub retorna 422
              // quando a referência já não existe; nesse caso, não há nada a limpar.
              if (![404, 422].includes(error.status)) throw error;
            }

      - name: Publicar V7 anterior à correção da splash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7-before-splash-fix
          target_commitish: d842050f511ccbd45e297df84ca2139b03825c75
          name: Controle Catedral — V7 antes da correção da splash
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/v7-pre-splash/Controle-Catedral-V7-antes-da-correcao-splash-Android.apk
            release-assets/v7-pre-splash/Controle-Catedral-V7-antes-da-correcao-splash-iOS.ipa
          body: |
            Build histórico da V7 anterior à correção que tornou a tela de splash visível.

            **Tipo de arquivos:** Android APK e iOS IPA não assinado.
            **Observação:** esta versão não tem a correção final da splash e não substitui a V7.1 certificada.

      - name: Publicar V7.1 certificada
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.1
          target_commitish: 3b24c8326ec0bca4e555f2d67e5d76995ed03efa
          name: Controle Catedral V7.1 — Certificada
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/v7-1/Controle-Catedral-V7.1-Android.apk
            release-assets/v7-1/Controle-Catedral-V7.1-iOS.ipa
          body: |
            **Versão certificada em 22/10/2026.**

            Inclui o APK Android e o IPA iOS não assinado, com a splash corrigida e a prévia de vídeo funcionando pela URL direta da API Holyrics.

            O IPA é não assinado e deve ser instalado pelo procedimento já utilizado no projeto.

            **Windows:** nenhum instalador executável Windows (.exe ou .msi) foi localizado nos repositórios ou nos artefatos de compilação disponíveis para anexar a esta release.
